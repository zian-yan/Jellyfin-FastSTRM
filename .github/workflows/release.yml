name: Build and Release

on:
  push:
    tags:
      # 只接受纯版本号标签（如 3.4.1、3.5.0-rc.1），不再使用 v 前缀
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (version only, e.g. 3.4.1)'
        required: true
        default: '3.4.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve and Verify Version
        id: version
        run: |
          set -e

          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"

          # 标签只带版本号：容错去掉误加的前缀 v
          TAG_NAME="${RAW_TAG#v}"

          # 只去掉第四段版本号：3.1.0.0 -> 3.1.0，3.1.0 保持不变
          normalize() {
            if [[ "$1" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
              echo "${BASH_REMATCH[1]}"
            else
              echo "$1"
            fi
          }

          CLEAN_VER=$(normalize "$TAG_NAME")
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "clean=${CLEAN_VER}" >> "$GITHUB_OUTPUT"

          CSPROJ_VER=$(grep -oP '(?<=<Version>)[^<]+' FastSTRM.csproj | head -n1)
          META_VER=$(grep -oP '(?<="version": ")[^"]+' meta.json | head -n1)
          BUILD_VER=$(grep -oP '(?<=^version: ")[^"]+' build.yaml | head -n1)

          echo "tag=${TAG_NAME} clean=${CLEAN_VER} csproj=${CSPROJ_VER} meta=${META_VER} build=${BUILD_VER}"
          echo "normalized: csproj=$(normalize "${CSPROJ_VER}") meta=$(normalize "${META_VER}") build=$(normalize "${BUILD_VER}")"

          for pair in "FastSTRM.csproj:${CSPROJ_VER}" "meta.json:${META_VER}" "build.yaml:${BUILD_VER}"; do
            file="${pair%%:*}"
            value="${pair#*:}"
            norm_val=$(normalize "$value")
            if [ "$norm_val" != "$CLEAN_VER" ]; then
              echo "::error::版本不一致：${file} 是 ${value}（归一化 ${norm_val}），tag 是 ${TAG_NAME}（期望 ${CLEAN_VER}）"
              exit 1
            fi
          done

      - name: Build Release DLL
        run: dotnet build FastSTRM.csproj -c Release --nologo

      - name: Prepare Release Assets
        run: |
          set -e

          if [ ! -f bin/Release/net10.0/FastSTRM.dll ]; then
            echo "::error::构建产物 bin/Release/net10.0/FastSTRM.dll 不存在"
            exit 1
          fi

          mkdir -p release-pkg
          cp bin/Release/net10.0/FastSTRM.dll release-pkg/
          cp README.md CHANGELOG.md meta.json build.yaml release-pkg/
          zip -j FastSTRM.zip release-pkg/*
          cp bin/Release/net10.0/FastSTRM.dll ./FastSTRM.dll

          ls -lh FastSTRM.dll FastSTRM.zip

      - name: Extract Release Notes
        env:
          CLEAN_VER: ${{ steps.version.outputs.clean }}
        run: |
          set -e

          # 精确匹配 "## [x.y.z]" 标题，避免 [] 被当成正则字符组
          if grep -qF "## [$CLEAN_VER]" CHANGELOG.md; then
            awk -v ver="## [$CLEAN_VER]" '
              index($0, ver) == 1 { flag = 1; next }
              flag && /^## \[/ { flag = 0 }
              flag { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::CHANGELOG.md 中没有找到 ${CLEAN_VER} 段落，使用默认说明"
            printf 'jellyfin-plugin-faststrm %s\n' "$CLEAN_VER" > RELEASE_NOTES.md
          fi

          echo "----- RELEASE_NOTES.md -----"
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: jellyfin-plugin-faststrm ${{ steps.version.outputs.clean }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            FastSTRM.dll
            FastSTRM.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Plugin Manifest
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -e

          CHECKSUM=$(md5sum FastSTRM.zip | awk '{print $1}')
          export CHECKSUM

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 切回 main 更新 manifest；工作流只由标签触发，提交回 main 不会造成循环
          git fetch origin main
          git checkout -B main origin/main

          python3 scripts/update_manifest.py

          if git diff --quiet -- manifest.json; then
            echo "manifest.json 无变化"
          else
            git add manifest.json
            git commit -m "chore: update plugin manifest for ${RELEASE_TAG}"
            git push origin main
          fi
